services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recommend-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: recommend
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d recommend"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
