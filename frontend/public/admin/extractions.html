<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AIRA · 검색 로그</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .zero-cnt { color: var(--err); font-weight: 700; }
  .result-cnt-ok { color: var(--ok); font-weight: 600; }

  /* MODAL */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.45);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(10,10,10,0.22);
    width: min(680px, 95vw);
    max-height: 85vh;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
    font-size: 14px; font-weight: 700;
    position: sticky; top: 0; background: #fff; z-index: 1;
  }
  .modal-head .close-btn {
    margin-left: auto;
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 5px;
    color: var(--text-3);
    cursor: pointer;
    border: 1px solid transparent;
    transition: all var(--dur) var(--ease);
  }
  .modal-head .close-btn:hover { background: var(--surface-2); border-color: var(--line); color: var(--text); }
  .modal-body { padding: 20px; }
  .result-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .result-row:last-child { border-bottom: none; }
  .result-rank {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    color: var(--text-3);
    flex-shrink: 0;
  }
  .result-thumb {
    width: 40px; height: 40px;
    border-radius: 5px;
    background: repeating-linear-gradient(135deg, var(--surface-2) 0 8px, var(--surface-3) 8px 16px);
    border: 1px solid var(--line);
    flex-shrink: 0;
    display: grid; place-items: center;
    color: var(--text-4);
    font-size: 9px;
    overflow: hidden;
  }
  .result-thumb img { width: 40px; height: 40px; object-fit: cover; }
  .result-info { flex: 1; min-width: 0; }
  .result-info .rn { font-size: 13px; font-weight: 600; color: var(--text); }
  .result-info .rc { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
  .result-dist {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: var(--ok);
    font-weight: 600;
    flex-shrink: 0;
  }
  .spinner-ring {
    width: 20px; height: 20px;
    border: 2px solid var(--line);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--surface-2); }
</style>
</head>
<body data-route="extractions">
  <div class="shell">
    <div id="side-mount"></div>
    <main class="main">
      <div id="top-mount"></div>

      <div class="page">

        <!-- PAGE HEAD -->
        <div class="page-head">
          <div>
            <h1>검색 로그</h1>
            <div class="sub">실시간 자연어 검색 이력 및 결과 0건 분석</div>
          </div>
        </div>

        <!-- STATS -->
        <div class="stat-row">
          <div class="stat">
            <div class="l info"><span class="d"></span>전체 검색</div>
            <div class="v" id="kpi-total">—</div>
            <div class="delta">누적 검색 횟수</div>
          </div>
          <div class="stat">
            <div class="l err"><span class="d"></span>결과 0건</div>
            <div class="v" id="kpi-zero">—</div>
            <div class="delta">개선 필요</div>
          </div>
          <div class="stat">
            <div class="l purple"><span class="d"></span>LLM 사용</div>
            <div class="v" id="kpi-llm">—</div>
            <div class="delta">LLM 파싱 적용</div>
          </div>
          <div class="stat">
            <div class="l ok"><span class="d"></span>평균 결과수</div>
            <div class="v" id="kpi-avg">—</div>
            <div class="delta">건 / 검색</div>
          </div>
        </div>

        <!-- FILTER -->
        <div class="card" style="margin-bottom:12px;">
          <div class="tabs" id="tabs">
            <div class="tab active" data-filter="all">전체</div>
            <div class="tab" data-filter="zero">결과없음</div>
            <div class="tab" data-filter="llm">LLM사용</div>
          </div>
          <div class="filters" style="grid-template-columns: 1fr auto;">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:13px;height:13px;stroke-width:1.8;flex-shrink:0;color:var(--text-4);margin-right:6px;"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="text" id="q-input" placeholder="검색어 필터…" style="flex:1;border:none;background:transparent;outline:none;font-size:12.5px;"/>
            </div>
            <div class="btns" style="display:flex;gap:6px;">
              <button class="btn" id="reset-btn">초기화</button>
              <button class="btn btn-primary" id="search-btn">검색</button>
            </div>
          </div>
        </div>

        <!-- LIST -->
        <div class="list-card">
          <div class="list-head">
            <span class="total">총 <b id="result-total">—</b>건</span>
            <span class="sp" style="flex:1;"></span>
          </div>
          <table>
            <thead>
              <tr>
                <th>검색어</th>
                <th>의미쿼리</th>
                <th>LLM</th>
                <th>백엔드</th>
                <th class="num">결과수</th>
                <th>광고주</th>
                <th>시각</th>
              </tr>
            </thead>
            <tbody id="log-tbody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-4);">로딩 중…</td></tr>
            </tbody>
          </table>
          <div class="list-foot">
            <span id="page-info">—</span>
            <div class="pgn" id="pgn">
              <button id="btn-prev">‹</button>
              <span id="page-num" style="padding:0 12px;font-size:12px;color:var(--text-3);"></span>
              <button id="btn-next">›</button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- RESULTS MODAL -->
  <div class="modal-backdrop" id="results-modal">
    <div class="modal">
      <div class="modal-head">
        <span id="modal-title">검색 결과 상품</span>
        <button class="close-btn" id="modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px;stroke-width:2;"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body">
        <div style="display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--text-4);">
          <div class="spinner-ring"></div>로딩 중…
        </div>
      </div>
    </div>
  </div>

  <script src="partials.js"></script>
  <script src="enhance.js"></script>
  <script>
    const EMBEDDER = 'http://192.168.101.27:8001';
    let currentPage = 0;
    const PAGE_SIZE = 20;
    let totalItems = 0;
    let currentQ = '';
    let currentFilter = 'all'; // all | zero | llm

    function escHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // --- KPI ---
    async function loadStats() {
      try {
        const data = await fetch(EMBEDDER + '/search-logs/stats').then(r => r.json());
        document.getElementById('kpi-total').textContent = data.total ?? '—';
        document.getElementById('kpi-zero').textContent = data.zero_results ?? '—';
        document.getElementById('kpi-llm').textContent = data.llm_used ?? '—';
        const avg = data.avg_results;
        document.getElementById('kpi-avg').textContent = avg != null ? Number(avg).toFixed(1) : '—';
      } catch (e) {
        console.error('stats 로드 실패', e);
      }
    }

    // --- Logs list ---
    async function loadLogs() {
      const tbody = document.getElementById('log-tbody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-4);"><div style="display:flex;align-items:center;justify-content:center;gap:8px;"><div class="spinner-ring"></div>로딩 중…</div></td></tr>';

      const params = new URLSearchParams({ page: currentPage, size: PAGE_SIZE });
      if (currentQ) params.set('q', currentQ);
      if (currentFilter === 'zero') params.set('zero_only', 'true');
      if (currentFilter === 'llm') params.set('llm_only', 'true');

      try {
        const res = await fetch(EMBEDDER + '/search-logs?' + params.toString());
        const data = await res.json();
        const items = data.items || data.content || data || [];
        const total = data.total ?? data.totalElements ?? items.length;
        totalItems = total;

        document.getElementById('result-total').textContent = total;
        document.getElementById('page-info').textContent =
          '총 ' + total + '건 중 ' + (total === 0 ? 0 : currentPage * PAGE_SIZE + 1) + ' - ' + Math.min((currentPage + 1) * PAGE_SIZE, total) + ' 표시';
        updatePagination(total);
        renderRows(items);
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--err);">데이터 로드 실패: ' + escHtml(e.message) + '</td></tr>';
      }
    }

    function renderRows(items) {
      const tbody = document.getElementById('log-tbody');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-4);">검색 결과가 없습니다.</td></tr>';
        return;
      }
      tbody.innerHTML = items.map(log => {
        const isZero = (log.result_count ?? 0) === 0;
        const cntClass = isZero ? 'zero-cnt' : 'result-cnt-ok';
        const llmBadge = log.llm_used
          ? '<span class="badge" style="background:var(--purple-soft);color:var(--purple);border-color:#E0D5FA;">LLM</span>'
          : '<span class="badge muted">—</span>';
        const ts = log.searched_at || log.created_at || log.timestamp || '';
        const timeStr = ts ? new Date(ts).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
        return `<tr class="clickable" onclick="openResults(${JSON.stringify(log.id)}, ${JSON.stringify(log.query || '')})">
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;">
            ${escHtml(log.query || '—')}
          </td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-3);font-size:12px;">
            ${escHtml(log.semantic_query || '—')}
          </td>
          <td>${llmBadge}</td>
          <td><span style="font-family:ui-monospace,monospace;font-size:11.5px;color:var(--text-3);">${escHtml(log.backend || '—')}</span></td>
          <td class="num tnum"><span class="${cntClass}">${log.result_count ?? '—'}</span></td>
          <td style="font-size:12px;color:var(--text-3);">${escHtml(log.advertiser_id ?? log.advertiser ?? '—')}</td>
          <td style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-4);">${timeStr}</td>
        </tr>`;
      }).join('');
    }

    function updatePagination(total) {
      const totalPages = Math.ceil(total / PAGE_SIZE);
      document.getElementById('page-num').textContent = (currentPage + 1) + ' / ' + (totalPages || 1);
      document.getElementById('btn-prev').disabled = currentPage === 0;
      document.getElementById('btn-next').disabled = currentPage >= totalPages - 1;
    }

    // --- Results modal ---
    async function openResults(logId, query) {
      const modal = document.getElementById('results-modal');
      const body = document.getElementById('modal-body');
      const title = document.getElementById('modal-title');
      title.textContent = '"' + query + '" 검색 결과';
      body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--text-4);"><div class="spinner-ring"></div>로딩 중…</div>';
      modal.classList.add('open');

      try {
        const data = await fetch(EMBEDDER + '/search-logs/' + logId + '/results').then(r => r.json());
        const items = data.items || data || [];
        if (!items.length) {
          body.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-4);">결과 상품이 없습니다.</div>';
          return;
        }
        body.innerHTML = items.map(item => {
          const thumbHtml = item.image_url
            ? `<img src="${escHtml(item.image_url)}" alt="" onerror="this.style.display='none'">`
            : 'img';
          const dist = item.distance != null ? ((1 - item.distance) * 100).toFixed(1) + '%' : '—';
          return `<div class="result-row">
            <div class="result-rank">${item.rank ?? '?'}</div>
            <div class="result-thumb">${thumbHtml}</div>
            <div class="result-info">
              <div class="rn">${escHtml(item.product_name || '—')}</div>
              <div class="rc">${escHtml(item.category || '—')}</div>
            </div>
            <div class="result-dist">${dist}</div>
          </div>`;
        }).join('');
      } catch (e) {
        body.innerHTML = '<div style="padding:24px;color:var(--err);">결과를 불러오지 못했습니다: ' + escHtml(e.message) + '</div>';
      }
    }

    // --- Event listeners ---
    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('results-modal').classList.remove('open');
    });
    document.getElementById('results-modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        currentPage = 0;
        loadLogs();
      });
    });

    document.getElementById('search-btn').addEventListener('click', () => {
      currentQ = document.getElementById('q-input').value.trim();
      currentPage = 0;
      loadLogs();
    });

    document.getElementById('q-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('search-btn').click();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('q-input').value = '';
      currentQ = '';
      currentFilter = 'all';
      currentPage = 0;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab[data-filter="all"]').classList.add('active');
      loadLogs();
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (currentPage > 0) { currentPage--; loadLogs(); }
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      if ((currentPage + 1) * PAGE_SIZE < totalItems) { currentPage++; loadLogs(); }
    });

    // init
    loadStats();
    loadLogs();
  </script>
</body>
</html>
